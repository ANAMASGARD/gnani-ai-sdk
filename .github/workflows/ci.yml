name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        with:
          name: npm-package
          path: "*.tgz"

  consumer:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        manager: [npm, pnpm, yarn, yarn-pnp, bun, deno]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        if: matrix.manager == 'pnpm'
        with:
          version: 11
      - uses: oven-sh/setup-bun@v2
        if: matrix.manager == 'bun'
      - uses: denoland/setup-deno@v2
        if: matrix.manager == 'deno'
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
      - run: bash scripts/check-install.sh ${{ matrix.manager }} ./*.tgz
